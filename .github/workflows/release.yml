name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0-dev; fi
          ARCHIVE="henesys-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGE=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/henesys" LICENSE README.md "$STAGE/"
          mkdir -p dist
          tar -C "$STAGE" -czf "dist/$ARCHIVE" henesys LICENSE README.md
          (cd dist && shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256")
          echo "${{ matrix.target }}: $(wc -c < "$STAGE/henesys") bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: henesys-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        run: |
          PRERELEASE=
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE dist/*/*.tar.gz dist/*/*.sha256
