[package]
name = "henesys"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Makes heavy commands on a shared machine wait their turn, and says what they are waiting behind."
repository = "https://github.com/Vusys/henesys"

[dependencies]
lexopt = "0.3.2"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "termios", "thread", "stdio"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[dev-dependencies]
tempfile = "3.27.0"
